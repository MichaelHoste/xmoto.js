<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>XMoto.js — level load test harness</title>
</head>
<body>
  <!-- Minimal DOM the game expects (see index.html) -->
  <div id="xmoto"></div>
  <div id="loading" style="display:none">loading</div>
  <div id="level-name" style="display:none"></div>
  <div id="chrono"></div>

  <!-- Same libraries as index.html, absolute paths so this works under /test/ -->
  <script src="/lib/jquery-1.10.2.js"       type="text/javascript"></script>
  <script src="/lib/lodash-4.17.21.min.js"  type="text/javascript"></script>
  <script src="/lib/pixi-8.18.1.min.js"     type="text/javascript"></script>
  <script src="/lib/planck-1.5.0.js"        type="text/javascript"></script>
  <script src="/lib/lz-string-1.3.3.min.js" type="text/javascript"></script>
  <script src="/lib/purl-2.3.1.js"          type="text/javascript"></script>
  <script src="/lib/stats.16.min.js"        type="text/javascript"></script>
  <script src="/bin/xmoto.js"               type="text/javascript"></script>

  <script type="text/javascript">
    // Loads one level and resolves { ok, error, warnings }.
    // - "error" (=> ok:false) is a real crash: an uncaught exception, a rejected
    //   promise, or a throw out of $.xmoto — i.e. the level failed to load.
    // - console.error messages are collected as non-fatal "warnings" (the game uses
    //   them for e.g. "texture not found in theme"), they do NOT fail the level.
    window.loadLevelForTest = function(filename, timeout) {
      timeout = timeout || 20000;

      return new Promise(function(resolve) {
        var errors = [];
        // Some warnings (e.g. "texture not found") can be logged once per entity,
        // so the same message may repeat dozens of times for a single level.
        // Dedupe by message and keep a count instead of flooding the output.
        var warningCounts = {};

        var onErr = function(e) { errors.push(e.message || (e.error && e.error.message) || String(e)); };
        var onRej = function(e) { errors.push('unhandledrejection: ' + ((e.reason && e.reason.message) || e.reason)); };

        window.addEventListener('error', onErr);
        window.addEventListener('unhandledrejection', onRej);

        var origErr = console.error;
        console.error = function() {
          var msg = Array.prototype.join.call(arguments, ' ');
          warningCounts[msg] = (warningCounts[msg] || 0) + 1;
          origErr.apply(console, arguments);
        };

        var done = false;
        function finish(result) {
          if (done) return;
          done = true;
          window.removeEventListener('error', onErr);
          window.removeEventListener('unhandledrejection', onRej);
          console.error = origErr;
          clearInterval(poll);
          clearTimeout(timer);
          try { window.cancelAnimationFrame(window.game_loop); } catch (e) {}
          result.warnings = Object.keys(warningCounts).map(function(msg) {
            var n = warningCounts[msg];
            return n > 1 ? msg + ' (x' + n + ')' : msg;
          });
          resolve(result);
        }

        var loading = document.querySelector('#loading');
        loading.style.display = 'block'; // ensure visible; the game hides it once init succeeds

        try {
          $.xmoto(filename, { width: 320, height: 240, playable: true });
        } catch (e) {
          errors.push('throw: ' + (e.message || e));
        }

        var timer = setTimeout(function() {
          finish({ ok: false, error: errors.length ? errors.join(' | ') : 'timeout: loading never completed' });
        }, timeout);

        var settled = false;
        var poll = setInterval(function() {
          if (errors.length) { finish({ ok: false, error: errors.join(' | ') }); return; }

          // The game hides #loading only after a successful parse + init.
          if (!settled && getComputedStyle(loading).display === 'none') {
            settled = true;
            // Let a few frames of the update loop run to surface runtime errors too.
            setTimeout(function() {
              finish({ ok: errors.length === 0, error: errors.length ? errors.join(' | ') : null });
            }, 400);
          }
        }, 40);
      });
    };
  </script>
</body>
</html>
